<!-- SFCC Altar Servers Attendance System — frontend/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SFCC Altar Servers - Executive Portal</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

  <div class="login-card">
    <img src="assets/images/logo.png" alt="SFCC Logo" class="login-logo" onerror="this.src='https://via.placeholder.com/72/00f0ff/000000?text=SFCC'">
    <h2 class="login-title">SFCC ALTAR SERVERS</h2>
    <p class="login-subtitle"> MANAGEMENT SYSTEM</p>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Executive Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-input" required placeholder="admin@sfcc-altarservers.org">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" required placeholder="••••••••••••">
          <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">SHOW</button>
        </div>
      </div>

      <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">AUTHENTICATE</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components.js"></script>
  
  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const toggleBtn = document.querySelector('.toggle-password');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        toggleBtn.textContent = 'HIDE';
      } else {
        passInput.type = 'password';
        toggleBtn.textContent = 'SHOW';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm') || document.getElementById('login-form');
      const errorMessage = document.getElementById('errorMessage') || document.getElementById('error-message');
      
      if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          const submitBtn = loginForm.querySelector('button[type="submit"]');

          console.log("[LOGIN HANDLER RUNNING]");
          console.log("AUTH OBJECT:", window.Auth);
          console.log("API BASE URL:", window.CONFIG?.API_BASE_URL);

          try {
            if (submitBtn) submitBtn.disabled = true;
            if (errorMessage) errorMessage.textContent = '';

            // MUST await the async login function
            await window.Auth.login(email, password);
          } catch (err) {
            console.error("[LOGIN FAILED]", err);
            if (errorMessage) {
              errorMessage.textContent = err.message || 'Authentication failed. Please check your credentials.';
            } else {
              alert(err.message || 'Login failed');
            }
          } finally {
            if (submitBtn) submitBtn.disabled = false;
          }
        });
      }
    });
  </script>
</body>
</html>
