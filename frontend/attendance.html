<!-- SFCC Altar Servers Attendance System — frontend/attendance.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance - SFCC Altar Servers</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-container">
    <script src="js/components.js"></script>
    <script>
      document.write(Components.renderSidebar('meetings'));
    </script>

    <main class="main-content">
      <header class="top-bar">
        <h2 class="page-title">Attendance Register</h2>
        <button onclick="saveAttendance()" class="btn-primary">Save Register</button>
      </header>

      <div class="content-body">
        <div id="attendance-container">
          <!-- Dynamically filled with checklist items -->
        </div>
      </div>
    </main>
  </div>
  <aside class="sidebar">
    <div class="sidebar-header">
      <img 
        src="frontend/assets/images/sfcc-logo.png" 
        alt="SFCC Logo" 
        class="sidebar-logo"
        onerror="this.style.display='none';"
      >
      <div class="sidebar-brand-text">
        <span class="brand-title">SFCC</span>
        <span class="brand-subtitle">Altar Servers AMS</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-link">Dashboard</a>
      <a href="members.html" class="nav-link">Members</a>
      <a href="meetings.html" class="nav-link">Meetings</a>
      <a href="attendance.html" class="nav-link">Attendance</a>
      <a href="reports.html" class="nav-link">Reports</a>
    </nav>
  </aside>   

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
