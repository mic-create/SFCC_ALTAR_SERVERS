<!-- SFCC Altar Servers Attendance System — frontend/reports.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports - SFCC Altar Servers</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-container">
    <script src="js/components.js"></script>
    <script>
      document.write(Components.renderSidebar('reports'));
    </script>

    <main class="main-content">
      <header class="top-bar">
        <h2 class="page-title">Attendance Analytics & Reports</h2>
      </header>

    <aside class="sidebar">
      <div class="sidebar-header">
        <img 
          src="frontend/assets/images/sfcc-logo.png" 
          alt="SFCC Logo" 
          class="sidebar-logo"
          onerror="this.style.display='none';"
        >
        <div class="sidebar-brand-text">
          <span class="brand-title">SFCC</span>
          <span class="brand-subtitle">Altar Servers AMS</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="members.html" class="nav-link">Members</a>
        <a href="meetings.html" class="nav-link">Meetings</a>
        <a href="attendance.html" class="nav-link">Attendance</a>
        <a href="reports.html" class="nav-link">Reports</a>
      </nav>
    </aside>   

      <div class="content-body">
        <div class="tech-card">
          <h3>Top Attending Altar Servers</h3>
          <div class="table-wrapper">
            <table class="tech-table">
              <thead>
                <tr>
                  <th>Member ID</th>
                  <th>Full Name</th>
                  <th>Class</th>
                  <th>Meetings Attended</th>
                  <th>Compliance Rate</th>
                </tr>
              </thead>
              <tbody id="top-attenders-body">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
